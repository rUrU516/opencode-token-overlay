<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Token Power Bar</title>
    <style>
      @font-face {
        font-family: "Press Start 2P";
        src: url("assets/fonts/PressStart2P-Regular.ttf") format("truetype");
        font-display: block;
      }
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
      body { font-family: "Press Start 2P", Monaco, monospace; user-select: none; -webkit-font-smoothing: none; }
      .overlay {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        image-rendering: pixelated;
        -webkit-app-region: drag;
      }
      .overlay.disconnected { filter: grayscale(1); opacity: .58; }

      .hud {
        position: absolute;
        left: 6px;
        top: 4px;
        width: 256px;
        height: 54px;
        filter: drop-shadow(3px 4px 0 rgba(10,9,15,.52));
      }
      .bar-shell {
        position: absolute;
        left: 2px;
        top: 10px;
        width: 248px;
        height: 34px;
        padding: 4px;
        border: 3px solid #17151e;
        background: #3d354a;
        box-shadow: inset 0 3px 0 #806d86, inset 0 -3px 0 #211e2a, inset 0 0 0 2px #0e1016, 3px 3px 0 #100e16;
        clip-path: polygon(4px 0,calc(100% - 4px) 0,calc(100% - 4px) 2px,100% 2px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 2px),0 calc(100% - 2px),0 4px,4px 4px);
      }
      .bar-shell::before {
        content: "";
        position: absolute;
        z-index: 7;
        left: 1px;
        top: 1px;
        width: 3px;
        height: 3px;
        background: #b29bbb;
        box-shadow: 238px 0 #b29bbb, 0 24px #181620, 238px 24px #181620;
      }
      .bar-track {
        position: relative;
        width: 100%;
        height: 20px;
        overflow: hidden;
        background:
          repeating-linear-gradient(90deg,transparent 0 13px,#090a10 13px 16px),
          repeating-linear-gradient(0deg,#111219 0 3px,#1b1c27 3px 5px);
      }
      .bar-track::before {
        content: "";
        position: absolute;
        z-index: 4;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(0deg,transparent 0 3px,rgba(4,5,9,.2) 3px 4px);
      }
      .bar-fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0;
        min-width: 2px;
        background: linear-gradient(90deg,#35bd59 0 50%,#e3c83c 50% 74%,#e87932 74% 88%,#e84b42 88% 100%);
        box-shadow: inset 0 4px rgba(255,255,210,.3), inset 0 -4px rgba(72,27,34,.3);
        transition: width 50ms linear;
      }
      .bar-fill::after {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(90deg,transparent 0 13px,#171720 13px 16px);
      }
      .active .bar-fill { filter: brightness(1.18) saturate(1.2); }
      .overlay:not(.active):not(.disconnected):not(.burst) .bar-shell { animation: idleShellBreath 3.2s steps(4) infinite; }
      .overlay:not(.active):not(.disconnected):not(.burst) .bar-fill { animation: idleFillBreath 3.2s steps(4) infinite; }
      .overlay:not(.active):not(.disconnected):not(.burst) .number { animation: idleNumberBreath 3.2s steps(4) infinite; }
      .overlay:not(.active):not(.disconnected):not(.burst) .bar-track::after {
        content: "";
        position: absolute;
        z-index: 3;
        top: 0;
        left: -12px;
        width: 8px;
        height: 20px;
        background: rgba(176,255,216,.16);
        animation: idleSweep 4.2s steps(14) infinite;
      }
      .active .bar-track::after {
        content: "";
        position: absolute;
        z-index: 2;
        top: 0;
        left: -30px;
        width: 20px;
        height: 20px;
        background: rgba(255,255,255,.68);
        transform: skewX(-20deg);
        animation: scan .68s linear infinite;
      }
      .number {
        position: absolute;
        z-index: 5;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding-bottom: 1px;
        color: #fff2a6;
        font-family: "Press Start 2P", monospace;
        font-size: 14px;
        font-weight: 400;
        line-height: 1;
        text-align: center;
        letter-spacing: -1px;
        font-variant-numeric: tabular-nums;
        -webkit-text-stroke: 1px #17151e;
        paint-order: stroke fill;
        text-shadow: 2px 2px 0 #7e3540;
      }
      .active .number { color: #fff77b; animation: numberGlitch .18s steps(2) infinite; }

      .legend {
        position: absolute;
        left: 8px;
        top: 1px;
        z-index: 9;
        width: 234px;
        display: flex;
        justify-content: space-between;
        color: #d9b85f;
        font: 400 6px/1 "Press Start 2P", monospace;
        letter-spacing: 0;
        text-shadow: 1px 1px 0 #17151e;
      }

      .max {
        position: absolute;
        right: 1px;
        top: 0;
        z-index: 8;
        color: #fff56d;
        font: 400 8px/1 "Press Start 2P", monospace;
        letter-spacing: -.08em;
        -webkit-text-stroke: 2px #17151e;
        paint-order: stroke fill;
        text-shadow: 2px 2px #e8483e;
        opacity: 0;
        transform: rotate(7deg) scale(.4);
      }
      .burst .max { animation: maxPop .52s steps(4); }

      .pixel { position: absolute; right: 5px; top: 27px; width: 6px; height: 6px; opacity: 0; background: var(--c,#fff36f); border: 1px solid #17151e; }
      .burst .pixel { animation: pixelBurst .54s steps(5); }
      .p1 { --x:-28px; --y:-27px; }
      .p2 { --x:13px; --y:-23px; --c:#ff654b; animation-delay:20ms !important; }
      .p3 { --x:16px; --y:20px; --c:#54d66c; animation-delay:40ms !important; }
      .p4 { --x:-24px; --y:24px; --c:#6fc9ff; animation-delay:60ms !important; }
      .p5 { --x:1px; --y:-31px; --c:#fff5aa; animation-delay:30ms !important; }
      .p6 { --x:-34px; --y:-2px; --c:#f0d64e; animation-delay:10ms !important; }

      .burst .hud { animation: overloadShake .1s steps(2) 5; }
      .burst .bar-shell { animation: barFlash .1s steps(2) 5; }
      .burst .bar-fill { width: 100% !important; background: #fff36d; filter: brightness(1.6); }

      .close {
        position: absolute;
        left: 0;
        bottom: 0;
        z-index: 20;
        width: 14px;
        height: 14px;
        border: 2px solid #202129;
        border-radius: 2px;
        color: #202129;
        background: #fff1a6;
        font: 400 8px/8px "Press Start 2P", monospace;
        cursor: pointer;
        opacity: 0;
        transition: opacity .12s;
        -webkit-app-region: no-drag;
      }
      .overlay:hover .close { opacity: 1; }

      @keyframes scan { to { transform: translateX(255px) skewX(-20deg); } }
      @keyframes idleSweep {
        0%,68% { transform:translateX(0); opacity:0; }
        72% { opacity:.8; }
        94% { opacity:.8; }
        100% { transform:translateX(252px); opacity:0; }
      }
      @keyframes idleShellBreath {
        0%,100% { filter: brightness(.92); }
        50% { filter: brightness(1.12); }
      }
      @keyframes idleFillBreath {
        0%,100% { filter: brightness(.82) saturate(.88); }
        50% { filter: brightness(1.14) saturate(1.08); }
      }
      @keyframes idleNumberBreath {
        0%,100% { color:#fff2a6; text-shadow:2px 2px 0 #923f3d; }
        50% { color:#fffbd8; text-shadow:2px 2px 0 #923f3d,0 0 6px rgba(255,231,91,.55); }
      }
      @keyframes numberGlitch { to { transform: translateX(1px); } }
      @keyframes maxPop { 0% { opacity:0; transform:rotate(7deg) scale(.4); } 20%,75% { opacity:1; transform:rotate(-5deg) scale(1.2); } 100% { opacity:0; transform:rotate(5deg) scale(1.45); } }
      @keyframes pixelBurst { 0% { opacity:1; transform:translate(0,0) rotate(0); } 75% { opacity:1; } 100% { opacity:0; transform:translate(var(--x),var(--y)) rotate(180deg); } }
      @keyframes overloadShake { 0% { transform:translate(-2px,1px); } 100% { transform:translate(2px,-1px); } }
      @keyframes barFlash { 0% { background:#fff36d; } 100% { background:#ff5148; } }
    </style>
  </head>
  <body>
    <section class="overlay">
      <button class="close" aria-label="关闭" onclick="window.close()">×</button>
      <div class="hud">
        <div class="legend"><span>PWR</span><span id="cache-hit">HIT --%</span></div>
        <div class="bar-shell">
          <div class="bar-track"><div class="bar-fill" id="bar"></div><div class="number" id="total">—</div></div>
        </div>
        <div class="max">MAX!!</div>
        <i class="pixel p1"></i><i class="pixel p2"></i><i class="pixel p3"></i>
        <i class="pixel p4"></i><i class="pixel p5"></i><i class="pixel p6"></i>
      </div>
    </section>
    <script src="renderer.js"></script>
  </body>
</html>
