<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Token Power Bar</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
      body {
        font-family: "SFMono-Regular", Menlo, Monaco, Consolas, monospace;
        user-select: none;
      }
      .overlay {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        image-rendering: pixelated;
        -webkit-app-region: drag;
      }
      .overlay.disconnected { filter: grayscale(1); opacity: .58; }

      .hud {
        position: absolute;
        left: 11px;
        top: 13px;
        width: 316px;
        height: 91px;
        filter: drop-shadow(5px 7px 0 rgba(0,0,0,.34));
      }
      .number {
        position: absolute;
        left: 7px;
        top: 0;
        color: #fff4b0;
        font-size: 29px;
        font-weight: 900;
        line-height: 1;
        letter-spacing: -.07em;
        font-variant-numeric: tabular-nums;
        -webkit-text-stroke: 2px #202129;
        paint-order: stroke fill;
        text-shadow: 3px 3px 0 #9a4a37;
      }
      .active .number { color: #fff777; animation: numberGlitch .18s steps(2) infinite; }

      .bar-shell {
        position: absolute;
        left: 4px;
        top: 46px;
        width: 277px;
        height: 30px;
        padding: 5px;
        border: 3px solid #202129;
        background: #353743;
        box-shadow: inset 0 0 0 2px #15161c, 3px 3px 0 rgba(0,0,0,.25);
      }
      .bar-track {
        position: relative;
        width: 100%;
        height: 14px;
        overflow: hidden;
        background: #171820;
      }
      .bar-fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0;
        min-width: 2px;
        background: linear-gradient(90deg, #4ed36a 0 48%, #f0d64e 68%, #ff654b 100%);
        box-shadow: inset 0 3px rgba(255,255,255,.28), inset 0 -3px rgba(0,0,0,.18);
        transition: width 50ms linear;
      }
      .bar-fill::after {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(90deg, transparent 0 12px, rgba(23,24,32,.62) 12px 15px);
      }
      .active .bar-fill { filter: brightness(1.18) saturate(1.2); }
      .active .bar-track::after {
        content: "";
        position: absolute;
        top: 0;
        left: -28px;
        width: 22px;
        height: 14px;
        background: rgba(255,255,255,.7);
        transform: skewX(-20deg);
        animation: scan .7s linear infinite;
      }

      .cap {
        position: absolute;
        right: 4px;
        top: 42px;
        width: 29px;
        height: 38px;
        border: 3px solid #202129;
        background: #ff5b48;
        box-shadow: inset 4px 4px rgba(255,255,255,.18), inset -4px -4px rgba(130,32,35,.28), 3px 3px rgba(0,0,0,.25);
      }
      .cap::before { content: ""; position: absolute; left: 7px; top: 7px; width: 9px; height: 18px; background: #fff18b; box-shadow: inset 3px 0 rgba(255,255,255,.4); }
      .active .cap { animation: capVibrate .16s steps(2) infinite; }

      .max {
        position: absolute;
        right: -3px;
        top: 0;
        z-index: 8;
        color: #fff56d;
        font: 900 13px/1 monospace;
        letter-spacing: -.08em;
        -webkit-text-stroke: 2px #202129;
        paint-order: stroke fill;
        text-shadow: 2px 2px #e8483e;
        opacity: 0;
        transform: rotate(7deg) scale(.4);
      }
      .burst .max { animation: maxPop .52s steps(4); }

      .pixel {
        position: absolute;
        right: 19px;
        top: 55px;
        width: 7px;
        height: 7px;
        opacity: 0;
        background: var(--c, #fff36f);
        border: 1px solid #202129;
      }
      .burst .pixel { animation: pixelBurst .58s steps(5); }
      .p1 { --x:-35px; --y:-45px; }
      .p2 { --x:20px; --y:-38px; --c:#ff654b; animation-delay:20ms !important; }
      .p3 { --x:27px; --y:17px; --c:#54d66c; animation-delay:40ms !important; }
      .p4 { --x:-28px; --y:26px; --c:#6fc9ff; animation-delay:60ms !important; }
      .p5 { --x:4px; --y:-53px; --c:#fff5aa; animation-delay:30ms !important; }
      .p6 { --x:-43px; --y:-8px; --c:#f0d64e; animation-delay:10ms !important; }

      .burst .hud { animation: overloadShake .1s steps(2) 5; }
      .burst .bar-shell { animation: barFlash .1s steps(2) 5; }
      .burst .bar-fill { width: 100% !important; background: #fff36d; filter: brightness(1.6); }

      .close {
        position: absolute;
        right: 3px;
        bottom: 3px;
        z-index: 20;
        width: 18px;
        height: 18px;
        border: 2px solid #202129;
        border-radius: 2px;
        color: #202129;
        background: #fff1a6;
        font: 900 12px/13px monospace;
        cursor: pointer;
        opacity: 0;
        transition: opacity .12s;
        -webkit-app-region: no-drag;
      }
      .overlay:hover .close { opacity: 1; }

      @keyframes scan { to { transform: translateX(300px) skewX(-20deg); } }
      @keyframes capVibrate { to { transform: translate(1px,-1px); filter: brightness(1.18); } }
      @keyframes numberGlitch { 0% { transform: translateX(0); } 100% { transform: translateX(1px); } }
      @keyframes maxPop { 0% { opacity: 0; transform: rotate(7deg) scale(.4); } 20%,75% { opacity: 1; transform: rotate(-5deg) scale(1.25); } 100% { opacity: 0; transform: rotate(5deg) scale(1.5); } }
      @keyframes pixelBurst { 0% { opacity: 1; transform: translate(0,0) rotate(0); } 75% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--x),var(--y)) rotate(180deg); } }
      @keyframes overloadShake { 0% { transform: translate(-2px,1px); } 100% { transform: translate(2px,-1px); } }
      @keyframes barFlash { 0% { background: #fff36d; } 100% { background: #ff5148; } }
    </style>
  </head>
  <body>
    <section class="overlay">
      <button class="close" aria-label="关闭" onclick="window.close()">×</button>
      <div class="hud">
        <div class="number" id="total">—</div>
        <div class="bar-shell"><div class="bar-track"><div class="bar-fill" id="bar"></div></div></div>
        <div class="cap"></div>
        <div class="max">MAX!!</div>
        <i class="pixel p1"></i><i class="pixel p2"></i><i class="pixel p3"></i>
        <i class="pixel p4"></i><i class="pixel p5"></i><i class="pixel p6"></i>
      </div>
    </section>
    <script src="renderer.js"></script>
  </body>
</html>
