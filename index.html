<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Token Power Bar</title>
    <style>
      @font-face {
        font-family: "Press Start 2P";
        src: url("assets/fonts/PressStart2P-Regular.ttf") format("truetype");
        font-display: block;
      }
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
      body { font-family: "Press Start 2P", Monaco, monospace; user-select: none; -webkit-font-smoothing: none; }
      .overlay {
        --theme-hue: 132;
        --energy-deep: hsl(var(--theme-hue) 58% 34%);
        --energy-main: hsl(var(--theme-hue) 66% 47%);
        --energy-bright: hsl(var(--theme-hue) 78% 64%);
        --energy-flash: hsl(var(--theme-hue) 92% 76%);
        --energy-shadow: hsl(var(--theme-hue) 48% 22%);
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        image-rendering: pixelated;
        -webkit-app-region: drag;
      }
      .overlay.disconnected { filter: grayscale(1); opacity: .58; }

      .question-panel {
        position: absolute;
        z-index: 30;
        left: 8px;
        top: 79px;
        width: 248px;
        color: #ede9d8;
        filter: drop-shadow(3px 4px 0 rgba(10,9,15,.52));
        -webkit-app-region: no-drag;
      }
      .question-panel[hidden] { display: none; }
      .question-shell {
        overflow: hidden;
        border: 3px solid #17151e;
        background: #3d354a;
        box-shadow: inset 0 3px 0 #806d86, inset 0 -3px 0 #211e2a, inset 0 0 0 2px #0e1016, 3px 3px 0 #100e16;
        clip-path: polygon(4px 0,calc(100% - 4px) 0,calc(100% - 4px) 2px,100% 2px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 2px),0 calc(100% - 2px),0 4px,4px 4px);
      }
      .question-toggle {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        height: 17px;
        padding: 1px 7px 0;
        border: 0;
        color: #d9b85f;
        background: #292531;
        cursor: pointer;
        font: 400 8px/1 "Press Start 2P", monospace;
        text-shadow: 1px 1px 0 #17151e;
      }
      .question-toggle:hover { background: #332e3c; }
      .question-status[data-status="waiting"] { color: #ffe475; }
      .question-status[data-status="answered"] { color: #77df88; }
      .question-status[data-status="rejected"] { color: #ff766b; }
      .question-chevron { transition: transform .12s steps(2); }
      .question-panel.collapsed .question-chevron { transform: rotate(180deg); }
      .question-content {
        position: relative;
        height: 330px;
        overflow: auto;
        padding: 9px 9px 11px;
        border-top: 2px solid #17151e;
        background:
          repeating-linear-gradient(0deg,transparent 0 3px,rgba(5,5,9,.18) 3px 4px),
          #1b1c25;
        scrollbar-width: none;
      }
      .question-content::-webkit-scrollbar { display: none; }
      .question-panel.collapsed .question-content { display: none; }
      .question-meta {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 7px;
        color: #858998;
        font: 10px/1.4 Monaco, monospace;
      }
      .question-block + .question-block { margin-top: 10px; padding-top: 9px; border-top: 1px solid #383a46; }
      .question-header {
        margin-bottom: 5px;
        color: #e4c85d;
        font: 400 8px/1.45 "Press Start 2P", monospace;
      }
      .question-text {
        color: #f1eddf;
        font: 12px/1.5 Monaco, "SFMono-Regular", monospace;
        user-select: text;
      }
      .question-options { display: flex; flex-direction: column; gap: 5px; margin-top: 8px; }
      .question-option {
        display: flex;
        align-items: flex-start;
        gap: 7px;
        width: 100%;
        padding: 6px 7px;
        border: 1px solid #4a4c58;
        color: #b9bdc8;
        background: #252731;
        cursor: pointer;
        text-align: left;
        font: 11px/1.4 Monaco, monospace;
      }
      .question-option:hover:not(:disabled) { border-color: #817787; background: #302d38; }
      .question-option:disabled { cursor: default; opacity: .65; }
      .question-option.selected { border-color: #58c96c; color: #d2f5d8; background: #203127; }
      .question-option.custom { border-style: dashed; color: #a4a8b4; }
      .question-option-index { flex: 0 0 15px; color: #d9b85f; }
      .question-option-main { min-width: 0; }
      .question-option-label { display: block; color: #e4e1d7; font-weight: 700; }
      .question-option.selected .question-option-label { color: #9be6a7; }
      .question-option-description { display: block; margin-top: 3px; color: #a0a4b1; font-size: 10px; line-height: 1.4; }
      .question-answer {
        margin-top: 7px;
        padding: 6px 7px;
        border-left: 3px solid #57c86c;
        color: #b9eec1;
        background: #1e3025;
        font: 11px/1.5 Monaco, monospace;
      }
      .question-answer.rejected { border-color: #dd574f; color: #ffc1b9; background: #342124; }
      .question-progress {
        display: flex;
        gap: 4px;
        margin-bottom: 8px;
      }
      .question-progress i { display: block; flex: 1; height: 3px; background: #3d3d48; }
      .question-progress i.done { background: #53c56a; }
      .question-progress i.current { background: #e1c753; }
      .question-hint { margin-top: 6px; color: #9296a3; font: 10px/1.4 Monaco, monospace; }
      .question-custom-input {
        width: 100%;
        min-height: 42px;
        margin-top: 6px;
        padding: 7px;
        resize: none;
        border: 1px dashed #686371;
        outline: none;
        color: #f2eddb;
        background: #15171f;
        font: 11px/1.45 Monaco, monospace;
      }
      .question-custom-input:focus { border-color: #dfc754; }
      .question-actions {
        position: sticky;
        bottom: -11px;
        display: flex;
        justify-content: space-between;
        gap: 6px;
        margin: 10px -9px -11px;
        padding: 8px 9px 9px;
        border-top: 1px solid #343641;
        background: #1b1c25;
      }
      .question-actions-right { display: flex; gap: 6px; margin-left: auto; }
      .question-button {
        min-height: 27px;
        padding: 6px 8px;
        border: 2px solid #17151e;
        color: #d8d9d6;
        background: #41414d;
        box-shadow: inset 0 2px #6d6d78, 2px 2px #101117;
        cursor: pointer;
        font: 7px/1.3 "Press Start 2P", monospace;
      }
      .question-button:hover:not(:disabled) { filter: brightness(1.15); }
      .question-button:disabled { cursor: default; opacity: .4; }
      .question-button.primary { color: #101511; background: #59cb6c; box-shadow: inset 0 2px #9aefa6, 2px 2px #132017; }
      .question-button.always { color: #211a08; background: #dfbd4f; box-shadow: inset 0 2px #ffe483, 2px 2px #211a0b; }
      .question-button.danger { color: #ffd0c9; background: #793d43; box-shadow: inset 0 2px #b76868, 2px 2px #211014; }
      .question-summary { display: flex; flex-direction: column; gap: 7px; }
      .question-summary-item { padding: 7px; border: 1px solid #3c3f49; background: #242630; }
      .question-summary-title { color: #dfc754; font: 8px/1.45 "Press Start 2P", monospace; }
      .question-summary-answer { margin-top: 5px; color: #c9eecf; font: 11px/1.45 Monaco, monospace; overflow-wrap: anywhere; }
      .question-error { margin-top: 7px; color: #ff8a7f; font: 10px/1.45 Monaco, monospace; }
      .question-sending { display: grid; min-height: 130px; place-items: center; color: #f2d762; font: 8px/1.8 "Press Start 2P", monospace; text-align: center; }
      .question-panel[data-kind="permission"] .question-toggle { color: #ffcf62; background: #332a28; }
      .permission-request {
        padding: 9px;
        border: 2px solid #9d7136;
        background: #34291f;
        box-shadow: inset 0 0 0 2px #1d1918;
      }
      .permission-action {
        color: #ffe39a;
        font: 9px/1.5 "Press Start 2P", monospace;
        overflow-wrap: anywhere;
      }
      .permission-section { margin-top: 11px; }
      .permission-resource,
      .permission-save {
        margin-top: 5px;
        padding: 7px 8px;
        border-left: 3px solid #d89a47;
        color: #f2eee2;
        background: #272630;
        font: 11px/1.5 Monaco, "SFMono-Regular", monospace;
        overflow-wrap: anywhere;
        user-select: text;
      }
      .permission-request .permission-resource {
        margin-top: 8px;
        padding: 7px 0 0 8px;
        background: transparent;
      }
      .permission-save { border-left-color: #d3bd57; color: #e9dda4; background: #302d23; }
      .permission-empty { color: #8d919d; font: 10px/1.45 Monaco, monospace; }
      .permission-details {
        margin-top: 9px;
        border: 1px solid #41434e;
        color: #aeb2bd;
        background: #20222a;
        font: 10px/1.45 Monaco, monospace;
      }
      .permission-details summary { padding: 6px 7px; color: #c6a955; cursor: pointer; font-weight: 700; }
      .permission-details pre,
      .permission-source { margin: 0; padding: 0 7px 7px; white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; }
      .permission-actions { justify-content: stretch; }
      .permission-actions .question-button { flex: 1; padding-left: 4px; padding-right: 4px; }

      .hud {
        position: absolute;
        left: 6px;
        top: 30px;
        width: 256px;
        height: 54px;
        filter: drop-shadow(3px 4px 0 rgba(10,9,15,.52));
      }
      .bar-shell {
        position: absolute;
        z-index: 5;
        left: 2px;
        top: 14px;
        width: 248px;
        height: 34px;
        padding: 4px;
        border: 3px solid #17151e;
        background: #3d354a;
        box-shadow: inset 0 3px 0 #806d86, inset 0 -3px 0 #211e2a, inset 0 0 0 2px #0e1016, 3px 3px 0 #100e16;
        clip-path: polygon(4px 0,calc(100% - 4px) 0,calc(100% - 4px) 2px,100% 2px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 2px),0 calc(100% - 2px),0 4px,4px 4px);
      }
      .bar-shell::before {
        content: "";
        position: absolute;
        z-index: 7;
        left: 1px;
        top: 1px;
        width: 3px;
        height: 3px;
        background: #b29bbb;
        box-shadow: 238px 0 #b29bbb, 0 24px #181620, 238px 24px #181620;
      }
      .bar-track {
        position: relative;
        width: 100%;
        height: 20px;
        overflow: hidden;
        background:
          repeating-linear-gradient(90deg,transparent 0 13px,#090a10 13px 16px),
          repeating-linear-gradient(0deg,#111219 0 3px,#1b1c27 3px 5px);
      }
      .bar-track::before {
        content: "";
        position: absolute;
        z-index: 4;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(0deg,transparent 0 3px,rgba(4,5,9,.2) 3px 4px);
      }
      .bar-fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0;
        min-width: 2px;
        background: linear-gradient(90deg,var(--energy-deep) 0 48%,var(--energy-main) 48% 78%,var(--energy-bright) 78% 100%);
        box-shadow: inset 0 4px rgba(255,255,240,.3), inset 0 -4px var(--energy-shadow);
        transition: width 50ms linear;
      }
      .bar-fill::after {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(90deg,transparent 0 13px,#171720 13px 16px);
      }
      .bar-fill::before {
        content: "";
        position: absolute;
        z-index: 2;
        right: -3px;
        top: 6px;
        width: 7px;
        height: 7px;
        opacity: 0;
        background: var(--energy-flash);
        clip-path: polygon(43% 0,57% 0,57% 43%,100% 43%,100% 57%,57% 57%,57% 100%,43% 100%,43% 57%,0 57%,0 43%,43% 43%);
      }
      .active .bar-fill { filter: brightness(1.18) saturate(1.2); }
      .critical .bar-fill { background: linear-gradient(90deg,var(--energy-deep) 0 48%,var(--energy-main) 48% 78%,var(--energy-bright) 78% 100%); filter: brightness(1.6) saturate(1.25); }
      .critical .bar-shell { animation: criticalFlash .18s steps(2) infinite; }
      .active.critical .number { color: #fffca0; animation: criticalNumber .14s steps(2) infinite; }
      .active.critical .bar-track::after { background: rgba(255,255,210,.9); animation-duration: .22s; }
      .critical .chip { background:var(--energy-flash); animation-duration: .28s !important; }
      .overlay:not(.active):not(.disconnected):not(.burst) .bar-shell { animation: idleShellBreath 3.2s steps(4) infinite; }
      .overlay:not(.active):not(.disconnected):not(.burst) .bar-fill { animation: idleFillBreath 3.2s steps(4) infinite; }
      .overlay:not(.active):not(.disconnected):not(.burst) .number { animation: idleNumberBreath 3.2s steps(4) infinite; }
      .overlay:not(.active):not(.disconnected):not(.burst) .bar-track::after {
        content: "";
        position: absolute;
        z-index: 3;
        top: 0;
        left: -12px;
        width: 8px;
        height: 20px;
        background: rgba(176,255,216,.16);
        animation: idleSweep 4.2s steps(14) infinite;
      }
      .active .bar-track::after {
        content: "";
        position: absolute;
        z-index: 2;
        top: 0;
        left: -30px;
        width: 20px;
        height: 20px;
        background: rgba(255,255,255,.68);
        transform: skewX(-20deg);
        animation: scan .68s linear infinite;
      }
      .number {
        position: absolute;
        z-index: 8;
        left: 9px;
        top: 21px;
        width: 234px;
        height: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding-bottom: 1px;
        color: #fff2a6;
        font-family: "Press Start 2P", monospace;
        font-size: 14px;
        font-weight: 400;
        line-height: 1;
        text-align: center;
        letter-spacing: -1px;
        font-variant-numeric: tabular-nums;
        -webkit-text-stroke: 1px #17151e;
        paint-order: stroke fill;
        text-shadow: 2px 2px 0 #7e3540;
      }
      .active .number { color: #fff77b; animation: numberGlitch .18s steps(2) infinite; }

      .legend {
        position: absolute;
        right: 14px;
        top: 0;
        z-index: 8;
        padding-top: 1px;
        line-height: 12px;
        white-space: nowrap;
        color: #d9b85f;
        font: 400 7px/1 "Press Start 2P", monospace;
        letter-spacing: 0;
        text-shadow: 1px 1px 0 #17151e;
        transition: opacity .08s steps(2), filter .08s steps(2);
      }
      .burst .legend { opacity:.16; filter:brightness(.55); }

      .token-runner {
        position: absolute;
        z-index: 10;
        left: var(--runner-x,9px);
        bottom: 40px;
        width: 31px;
        height: 39px;
        transform: translateX(-50%);
        pointer-events: none;
        will-change: left, transform;
      }
      .token-runner svg {
        width: 31px;
        height: 39px;
        overflow: visible;
        filter: drop-shadow(1px 1px 0 #0b0910);
      }
      .token-runner line {
        stroke-width: 4.5;
        stroke-linecap: square;
        stroke-linejoin: miter;
      }
      .token-runner .runner-rear { stroke: var(--energy-deep); opacity: .72; }
      .token-runner .runner-core { stroke: var(--energy-main); }
      .token-runner .runner-front { stroke: var(--energy-bright); }
      .token-runner .runner-head { fill: var(--energy-flash); stroke: #17151e; stroke-width: 3; }
      .token-runner .runner-eye { fill: #17151e; }
      .overlay:not(.active):not(.burst) .token-runner { filter: brightness(.84) saturate(.8); }
      .active .token-runner { filter: brightness(1.12) saturate(1.12); }
      .critical .token-runner { filter: brightness(1.55) saturate(1.25); }
      .burst .token-runner { animation: runnerReset 1.2s steps(20) both; }

      .runner-wind {
        position: absolute;
        z-index: 8;
        left: 2px;
        bottom: 39px;
        width: 248px;
        height: 43px;
        opacity: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .runner-wind i {
        position: absolute;
        top: var(--wind-top,20px);
        right: -64px;
        width: var(--wind-width,42px);
        height: 2px;
        opacity: var(--wind-opacity,.7);
        background: var(--energy-bright);
        box-shadow: 0 1px var(--energy-deep);
        animation: runnerWind var(--wind-duration,.72s) steps(10) var(--wind-delay,0s) infinite;
      }
      .active .runner-wind { opacity:.46; }
      .critical .runner-wind { opacity:1; filter:brightness(1.45); }
      .burst .runner-wind { opacity:.9; }
      .burst .runner-wind i { left:-64px; right:auto; animation-name:runnerWindBack; animation-duration:.38s; }

      .chips {
        position: absolute;
        z-index: 7;
        left: var(--chip-x,9px);
        top: 29px;
        width: 1px;
        height: 1px;
        pointer-events: none;
      }
      .chips::after {
        content: "";
        position: absolute;
        left: -4px;
        top: -1px;
        width: 9px;
        height: 3px;
        opacity: 0;
        background: var(--energy-flash);
        box-shadow: 5px 5px var(--energy-deep),-4px 9px var(--energy-bright);
      }
      .chip {
        position: absolute;
        left: -2px;
        top: -2px;
        width: var(--size,4px);
        height: var(--size,4px);
        opacity: 0;
        background: hsl(var(--theme-hue) 72% var(--chip-lightness,52%));
        box-shadow: inset -1px -1px var(--energy-shadow);
      }
      .active:not(.burst) .bar-fill::before { animation: chipImpact .46s steps(3) infinite; }
      .active:not(.burst) .chips::after { animation: chipSlash .58s steps(4) infinite; }
      .active:not(.burst) .chip { animation: chipSpit .64s steps(5) infinite; }
      .chip.c1 { --x:-17px; --y:-25px; --size:5px; }
      .chip.c2 { --x:15px; --y:-28px; --size:4px; animation-delay:-.08s !important; }
      .chip.c3 { --x:21px; --y:25px; --size:5px; animation-delay:-.16s !important; }
      .chip.c4 { --x:-14px; --y:29px; --size:4px; animation-delay:-.24s !important; }
      .chip.c5 { --x:9px; --y:-22px; --size:3px; animation-delay:-.32s !important; }
      .chip.c6 { --x:-23px; --y:20px; --size:3px; animation-delay:-.4s !important; }
      .chip.c7 { --x:26px; --y:-18px; --size:3px; animation-delay:-.48s !important; }
      .chip.c8 { --x:19px; --y:31px; --size:4px; animation-delay:-.56s !important; }

      .max {
        position: absolute;
        right: 1px;
        top: 0;
        z-index: 12;
        color: var(--energy-flash);
        font: 400 8px/1 "Press Start 2P", monospace;
        letter-spacing: -.08em;
        -webkit-text-stroke: 2px #17151e;
        paint-order: stroke fill;
        text-shadow: 2px 2px var(--energy-deep);
        opacity: 0;
        transform: rotate(7deg) scale(.4);
      }
      .burst .max { animation: maxPop 1.2s steps(8); }

      .pixel { position: absolute; z-index: 9; right: 5px; top: 27px; width: 6px; height: 6px; opacity: 0; background: var(--c,#fff36f); border: 1px solid #17151e; }
      .burst .pixel { animation: pixelBurst .54s steps(5); }
      .p1 { --x:-28px; --y:-27px; --c:var(--energy-flash); }
      .p2 { --x:13px; --y:-23px; --c:var(--energy-main); animation-delay:20ms !important; }
      .p3 { --x:16px; --y:20px; --c:var(--energy-bright); animation-delay:40ms !important; }
      .p4 { --x:-24px; --y:24px; --c:var(--energy-deep); animation-delay:60ms !important; }
      .p5 { --x:1px; --y:-31px; --c:var(--energy-flash); animation-delay:30ms !important; }
      .p6 { --x:-34px; --y:-2px; --c:var(--energy-bright); animation-delay:10ms !important; }

      .burst .hud { animation: overloadShake .1s steps(2) 5; }
      .burst .bar-shell { animation: barFlash .1s steps(2) 5; }
      .burst .bar-fill { width: 100% !important; background: var(--energy-flash); filter: brightness(1.6); }

      .close {
        position: absolute;
        left: 0;
        top: 86px;
        z-index: 20;
        width: 14px;
        height: 14px;
        border: 2px solid #202129;
        border-radius: 2px;
        color: #202129;
        background: #fff1a6;
        font: 400 8px/8px "Press Start 2P", monospace;
        cursor: pointer;
        opacity: 0;
        transition: opacity .12s;
        -webkit-app-region: no-drag;
      }
      .overlay:hover .close { opacity: 1; }

      @keyframes scan { to { transform: translateX(255px) skewX(-20deg); } }
      @keyframes idleSweep {
        0%,68% { transform:translateX(0); opacity:0; }
        72% { opacity:.8; }
        94% { opacity:.8; }
        100% { transform:translateX(252px); opacity:0; }
      }
      @keyframes idleShellBreath {
        0%,100% { filter: brightness(.92); }
        50% { filter: brightness(1.12); }
      }
      @keyframes idleFillBreath {
        0%,100% { filter: brightness(.82) saturate(.88); }
        50% { filter: brightness(1.14) saturate(1.08); }
      }
      @keyframes idleNumberBreath {
        0%,100% { color:#fff2a6; text-shadow:2px 2px 0 #923f3d; }
        50% { color:#fffbd8; text-shadow:2px 2px 0 #923f3d,0 0 6px rgba(255,231,91,.55); }
      }
      @keyframes numberGlitch { to { transform: translateX(1px); } }
      @keyframes chipImpact {
        0%,20% { opacity:0; transform:scale(.35); }
        21%,58% { opacity:1; transform:scale(1); }
        59%,100% { opacity:0; transform:scale(1.35); }
      }
      @keyframes chipSpit {
        0% { opacity:0; transform:translate(0,0) rotate(0); }
        18% { opacity:1; }
        72% { opacity:1; }
        100% { opacity:0; transform:translate(var(--x,-12px),var(--y,-13px)) rotate(var(--spin,180deg)); }
      }
      @keyframes chipSlash {
        0%,15% { opacity:0; transform:translate(0,0) rotate(-28deg) scaleX(.4); }
        16%,65% { opacity:1; }
        100% { opacity:0; transform:translate(-18px,-21px) rotate(-28deg) scaleX(1.3); }
      }
      @keyframes maxPop { 0% { opacity:0; transform:rotate(7deg) scale(.4); } 20%,75% { opacity:1; transform:rotate(-5deg) scale(1.2); } 100% { opacity:0; transform:rotate(5deg) scale(1.45); } }
      @keyframes criticalFlash { 0%,100% { filter:brightness(1); } 50% { filter:brightness(1.55); } }
      @keyframes criticalNumber { 0%,100% { transform:translateX(0); } 50% { transform:translateX(1px); } }
      @keyframes pixelBurst { 0% { opacity:1; transform:translate(0,0) rotate(0); } 75% { opacity:1; } 100% { opacity:0; transform:translate(var(--x),var(--y)) rotate(180deg); } }
      @keyframes overloadShake { 0% { transform:translate(-2px,1px); } 100% { transform:translate(2px,-1px); } }
      @keyframes barFlash { 0% { background:var(--energy-flash); } 100% { background:var(--energy-deep); } }
      @keyframes runnerReset {
        0% { left:243px; transform:translateX(-50%) translateY(0) rotate(0); }
        45% { transform:translateX(-50%) translateY(-26px) rotate(-180deg); }
        100% { left:var(--runner-x,9px); transform:translateX(-50%) translateY(0) rotate(-360deg); }
      }
      @keyframes runnerWind { to { transform:translateX(-330px); opacity:0; } }
      @keyframes runnerWindBack { to { transform:translateX(330px); opacity:0; } }
    </style>
  </head>
  <body>
    <section class="overlay">
      <button class="close" aria-label="关闭" onclick="window.close()">×</button>
      <div class="hud">
        <div class="legend" id="cache-hit">HIT --.----%</div>
        <div class="runner-wind" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        <div class="token-runner" aria-hidden="true">
          <svg viewBox="0 0 58 72">
            <g class="runner-rear"><line id="runner-arm-b-upper"/><line id="runner-arm-b-lower"/><line id="runner-leg-b-upper"/><line id="runner-leg-b-lower"/></g>
            <line id="runner-torso" class="runner-core"/>
            <g class="runner-front"><line id="runner-arm-a-upper"/><line id="runner-arm-a-lower"/><line id="runner-leg-a-upper"/><line id="runner-leg-a-lower"/></g>
            <circle id="runner-head" class="runner-head" r="8"/><rect id="runner-eye" class="runner-eye" width="3" height="3"/>
          </svg>
        </div>
        <div class="bar-shell">
          <div class="bar-track"><div class="bar-fill" id="bar"></div></div>
        </div>
        <div class="number" id="total">—</div>
        <div class="chips" aria-hidden="true">
          <i class="chip c1"></i><i class="chip c2"></i><i class="chip c3"></i><i class="chip c4"></i><i class="chip c5"></i>
          <i class="chip c6"></i><i class="chip c7"></i><i class="chip c8"></i>
        </div>
        <div class="max">MAX!!</div>
        <i class="pixel p1"></i><i class="pixel p2"></i><i class="pixel p3"></i>
        <i class="pixel p4"></i><i class="pixel p5"></i><i class="pixel p6"></i>
      </div>
      <aside class="question-panel" id="question-panel" hidden>
        <div class="question-shell">
          <button class="question-toggle" id="question-toggle" type="button" aria-expanded="true">
            <span><span class="question-status" id="question-status" data-status="waiting">QUESTION</span> <span id="question-count"></span></span>
            <span class="question-chevron">▲</span>
          </button>
          <div class="question-content" id="question-content"></div>
        </div>
      </aside>
    </section>
    <script src="renderer.js"></script>
  </body>
</html>
